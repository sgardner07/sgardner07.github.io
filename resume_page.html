<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div style="height: 30px;"></div>
    <header>
        <nav>
            <div class="logo">
                <a href="index.html">Sydney Gardner</a>
            </div>
            <div class="hamburger" id="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <ul class="nav-links" id="navLinks">
                <li><a href="index.html">Home</a></li>
                <li><a href="reels.html">Reels</a></li>
                <li><a href="3d-work.html">3D Work</a></li>
                <li><a href="films.html">Films</a></li>
                <li><a href="resume_page.html" class="active">Resume</a></li>
                <li><a href="about.html">About Me</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Resume</h1>
        </section>

        <section class="content-section">
            <div class="project-image-container" style="max-width: 1000px;">
                <iframe src="project_media/resume/Sydney_Gardner_Technical_Resume_January_2026.pdf" type="application/pdf" style="width: 100%; height: 800px; border: none; border-radius: 8px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);"></iframe>
            </div>
        </section>

        <section class="content-section" style="text-align: center; margin-top: 40px;">
            <a href="about.html" class="section-link">← Back to About Me</a>
        </section>
    </main>

    <footer>
        <p>© 2025 Sydney Gardner</p>
    </footer>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const hamburger = document.getElementById('hamburger');
            const navLinks = document.getElementById('navLinks');
            
            if (hamburger && navLinks) {
                hamburger.addEventListener('click', function() {
                    hamburger.classList.toggle('active');
                    navLinks.classList.toggle('active');
                });
                
                const links = navLinks.querySelectorAll('a');
                links.forEach(link => {
                    link.addEventListener('click', function() {
                        hamburger.classList.remove('active');
                        navLinks.classList.remove('active');
                    });
                });
            }
        });
    </script>
</body>
</html>
